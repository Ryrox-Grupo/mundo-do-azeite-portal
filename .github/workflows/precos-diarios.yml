# Preços do azeite todos os dias (Comissão Europeia), mesmo com o computador da Ryrox desligado
name: Preços do azeite
on:
  schedule:
    - cron: "30 6 * * *"   # 06:30 UTC, todos os dias
  workflow_dispatch:
permissions:
  contents: write
jobs:
  precos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python ferramentas/precos-azeite.py
        env:
          MDA_PRECOS_DESTINO: precos.js
      - name: Gravar se mudou
        run: |
          git config user.name "Ryrox (preços automáticos)"
          git config user.email "precos@users.noreply.github.com"
          git add precos.js
          git diff --cached --quiet || (git commit -m "Preços do azeite $(date +%d-%m-%Y)" && git push)
